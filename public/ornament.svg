<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Kazakh oyu corner ornament. One half is drawn and mirrored across the
       diagonal; the whole piece is flipped so its corner sits top-right. -->
  <g transform="matrix(-1 0 0 1 600 0)">
    <g id="oyu-half" fill="#fff" stroke="#fff" stroke-linecap="round">
      <path fill="none" stroke-width="44" d="M262 280C240 222 222 168 216 110"/>
      <path fill="none" stroke-width="46" d="M296 284C276 204 290 112 348 94C408 76 444 142 414 186C388 224 332 208 336 166C339 142 364 136 372 150"/>
      <path stroke="none" d="M318 300C400 276 452 200 486 130C504 94 526 74 552 58C536 86 522 116 510 150C488 220 440 290 350 330Z"/>
      <path stroke="none" d="M204 240C152 204 100 142 58 58C142 100 204 152 240 204Z"/>
      <path stroke="none" d="M292 356C330 396 380 420 422 422C420 380 396 330 356 292Z"/>
      <circle stroke="none" cx="290" cy="290" r="58"/>
    </g>
    <use href="#oyu-half" transform="matrix(0 1 1 0 0 0)"/>
  </g>
</svg>
