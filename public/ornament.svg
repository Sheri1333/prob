      <path stroke-width="11" d="M120 112C120 92 130 74 150 66C170 58 186 70 182 86C178 100 160 98 162 86"/>
      <path stroke-width="8" d="M120 58C124 40 138 30 152 34"/>
      <path stroke-width="7" d="M120 186C126 172 140 170 146 180C150 188 142 194 137 188"/>
    </g>
    <use href="#talapker-horn" transform="matrix(-1 0 0 1 240 0)"/>
  </g>
</svg>
