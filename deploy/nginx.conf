# Vhost for talapkergo.kz (certificates from certbot). Install or update once:
#   sudo cp /var/www/talapker/deploy/nginx.conf /etc/nginx/sites-available/talapker
#   sudo nginx -t && sudo systemctl reload nginx
# Site rules live in nginx-site.conf and ship with every deploy.

server {
    listen 80;
    listen [::]:80;
    server_name talapkergo.kz www.talapkergo.kz;
    server_tokens off;
    return 301 https://talapkergo.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.talapkergo.kz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/talapkergo.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talapkergo.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /var/www/talapker/deploy/nginx-security-headers.conf;
    return 301 https://talapkergo.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name talapkergo.kz;

    ssl_certificate /etc/letsencrypt/live/talapkergo.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talapkergo.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /var/www/talapker/deploy/nginx-site.conf;
}
