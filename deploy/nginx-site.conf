# Rules for the talapkergo.kz HTTPS server block. Lives in the repo and is
# included by the vhost, so deploy.sh (git pull + nginx reload) ships changes.

root /var/www/talapker/dist;
index index.html;

client_max_body_size 50m;
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml image/svg+xml;

include /var/www/talapker/deploy/nginx-security-headers.conf;

location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite puts a content hash in every asset name, so they never change.
location /assets/ {
    include /var/www/talapker/deploy/nginx-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    include /var/www/talapker/deploy/nginx-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /favicon.ico {
    try_files /favicon.png =404;
}

# Routes the React app knows (keep in sync with src/App.tsx).
location = / {
    rewrite ^ /index.html last;
}
location ~ ^/(faq|terms|privacy|login|register|forgot|reset|verify|profile|admin|exam)(/.*)?$ {
    rewrite ^ /index.html last;
}

# Everything else is a real file or a real 404. The 404 still renders the
# app, which shows its "page not found" screen, but with a 404 status.
location / {
    try_files $uri =404;
}
error_page 404 /index.html;
